name: build-android

# Builds the debug APK, runs the rule-engine tests, attaches the APK to the
# rolling "latest" pre-release, and points the README download link at it.
# The model file is not built here; it lives on the "model-v1" release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list names the removed 'tools'
          # package and sdkmanager fails on it; install explicitly below.
          packages: ""

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK after this commit
        run: |
          set -euo pipefail
          # A fixed filename on the rolling release is cached by browsers and
          # Android; the commit id in the name gives every build its own URL.
          APK_FILE="yoda-translator-${GITHUB_SHA:0:7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          ls -lh "$APK_FILE"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoda-translator-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Update rolling "latest" pre-release (main pushes)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (rolling)
          prerelease: true
          body: |
            Auto-built APK from the latest `main` commit (${{ github.sha }}).

            **Install on a phone:** download `${{ env.APK_FILE }}`, open it, and
            allow "install from this source" when Android asks. Android 8.0 or
            newer, 64-bit ARM.

            The Yoda model is a separate 1.1 GB download on the `model-v1`
            release; import it once from the app's "Import model file…" button.
            Every build uses the same debug key, so updates keep the model.
          files: ${{ env.APK_FILE }}
          fail_on_unmatched_files: true

      # The filename changes every build, so this step rewrites the README link
      # and pushes with a skip-ci marker so the bump does not trigger a build.
      - name: Point README at the APK this build produced (main pushes)
        if: github.ref == 'refs/heads/main'
        env:
          APK_FILE: ${{ env.APK_FILE }}
        run: |
          set -euo pipefail
          git checkout -- . 2>/dev/null || true
          git fetch --depth=1 origin main
          git checkout -B _readme_bump FETCH_HEAD
          python3 - "$APK_FILE" <<'PY'
          import re
          import sys

          apk = sys.argv[1]
          text = open("README.md", encoding="utf-8").read()
          out = re.sub(r"yoda-translator-[0-9a-f]{7,40}\.apk", apk, text)
          open("README.md", "w", encoding="utf-8").write(out)
          print("README unchanged" if out == text else f"README -> {apk}")
          PY
          if git diff --quiet -- README.md; then
            echo "README already points at ${APK_FILE}"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "README: download link -> ${APK_FILE} [skip ci]"
          git push origin _readme_bump:main \
            || echo "push rejected (main moved), the next build will correct the README"

      - name: Create tagged release (vX.Y.Z tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            Yoda Translator ${{ github.ref_name }}. Sideload only, debug-signed.
          files: ${{ env.APK_FILE }}
          fail_on_unmatched_files: true
